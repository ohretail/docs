{{- $current := . }}
<nav class="crumbs" aria-label="Breadcrumb">
  <ol>
    {{- range .Ancestors.Reverse }}
    <li><a href="{{ .RelPermalink }}">{{ if .IsHome }}Help{{ else }}{{ .LinkTitle }}{{ end }}</a></li>
    {{- end }}
    <li><span aria-current="page">{{ .LinkTitle }}</span></li>
  </ol>
</nav>
