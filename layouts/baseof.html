<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}">
  <a class="skip" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  {{- with resources.Get "js/site.js" | js.Build (dict "minify" hugo.IsProduction) | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
  {{- end }}
</body>
</html>
