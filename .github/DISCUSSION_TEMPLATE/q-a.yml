body:
  - type: markdown
    attributes:
      value: |
        **Discussions are public.** Don't include passwords, PINs, register setup
        files, customer details, or card numbers.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Oh! Retail POS
        - Simple Scheduler
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried? Link the guide you followed, if any.
    validations:
      required: true
